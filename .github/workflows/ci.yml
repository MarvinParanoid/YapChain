# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch/PR at a time; a newer push cancels the older run, except on main, where every
# commit keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: ${{ matrix.arch }} / ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout || 75 }}
    strategy:
      fail-fast: false
      matrix:
        # `arch` must be a real axis: with only `include` entries the second one overwrites the
        # first in every combination and x86_64 never runs.
        arch: [x86_64, aarch64]
        compiler: [gcc, clang]
        preset: [debug, release, asan]
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
          # GCC ASan on arm64 runs in-process tests ~90x slower than Clang ASan on the same runner
          # (run 45450447412; cause under diagnosis: asan-arm64-diagnose.yml, docs/ci.md). Only here the
          # long-running tests run at 25 % scale with the same checks; every other job runs them in full.
          - { arch: aarch64, compiler: gcc, preset: asan, long_test_scale: 25, timeout: 120 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build make g++-14 clang-18 libcurl4-openssl-dev
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc-14" >> "$GITHUB_ENV"; echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            echo "CC=clang-18" >> "$GITHUB_ENV"; echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Versions
        run: |
          "$CXX" --version | head -1; cmake --version | head -1; ninja --version
          curl-config --version; python3 --version; uname -m

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DYAP_LONG_TEST_SCALE_PERCENT=${{ matrix.long_test_scale || 100 }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Keep test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-logs-${{ matrix.arch }}-${{ matrix.compiler }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          retention-days: 14

  vectors-reproducible:
    name: test vectors are reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Regenerate with the independent reference implementation
        run: |
          python3 -I tools/refgen/refgen.py --out "$RUNNER_TEMP/vectors"
          diff -r "$RUNNER_TEMP/vectors" test-vectors

  fuzz:
    name: libFuzzer (clang, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build make clang-18 libclang-rt-18-dev libcurl4-openssl-dev
      - name: Build fuzz targets
        run: |
          cmake --preset fuzz -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz
      - name: Run each target for 120 s
        run: |
          for t in ycs bech32m tx devblock abci rpc; do
            test -x "./build/fuzz/tests/fuzz_$t" || { echo "missing fuzz target $t"; exit 1; }
            mkdir -p "corpus/$t"
            ./build/fuzz/tests/fuzz_$t "corpus/$t" -max_total_time=120 -print_final_stats=1
          done
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          retention-days: 14

  # Live consensus tests with a real CometBFT v0.40.0 (built here from the verified source archive of
  # the tag, ADR-0027) on x86_64 only: the 12 build jobs do not register them (no CometBFT there).
  live:
    name: live CometBFT (x86_64, gcc, debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIVE_TESTS: "integration:(live_cometbft|live_multival|live_netcli)$"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"  # the toolchain the localnet binary was verified with; go.mod needs >= 1.25
          cache: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build make g++-14 libcurl4-openssl-dev openssl
          echo "CC=gcc-14" >> "$GITHUB_ENV"; echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Build CometBFT v0.40.0 (SHA-256 of the tag archive, go mod verify)
        run: python3 -I scripts/localnet/localnet.py build-cometbft --download --out build/cometbft
      - name: Configure and build
        run: |
          cmake --preset debug -DYAP_COMETBFT_BIN="$PWD/build/cometbft/cometbft"
          cmake --build --preset debug
      - name: The live tests are registered (an empty selection is a failure)
        run: |
          n=$(ctest --preset debug -N -R "$LIVE_TESTS" | grep -c "Test *#")
          echo "registered live tests: $n"; test "$n" -eq 3
      - name: Run the live tests
        run: ctest --preset debug -R "$LIVE_TESTS"
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: live-logs
          # Node logs only (checked by the tests to contain no secrets); never keys or databases.
          path: |
            build/debug/Testing/Temporary/
            /tmp/y*-*/**/*.log
          retention-days: 14

  # ThreadSanitizer (Clang 18) on the whole suite except the long fault scenarios, with a TSan build of
  # yapd in the live tests. Only the documented LMDB suppressions (cmake/tsan-suppressions.txt).
  tsan:
    name: TSan (x86_64, clang, live tests included)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build make clang-18 libclang-rt-18-dev libcurl4-openssl-dev openssl
          echo "CC=clang-18" >> "$GITHUB_ENV"; echo "CXX=clang++-18" >> "$GITHUB_ENV"
          # LLVM 18 TSan cannot map its shadow with the 32-bit mmap randomisation of newer runner
          # kernels ("unexpected memory mapping"); 28 bits is the documented workaround. Runner only.
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build CometBFT v0.40.0
        run: python3 -I scripts/localnet/localnet.py build-cometbft --download --out build/cometbft
      - name: Configure and build
        run: |
          cmake --preset tsan -DYAP_COMETBFT_BIN="$PWD/build/cometbft/cometbft"
          cmake --build --preset tsan
      - name: The live tests are registered
        run: |
          n=$(ctest --preset tsan -N -R "integration:(live_cometbft|live_multival|live_netcli)$" | grep -c "Test *#")
          echo "registered live tests: $n"; test "$n" -eq 3
      - name: Test (all but the long fault scenarios)
        run: ctest --preset tsan -LE fault
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tsan-logs
          path: |
            build/tsan/Testing/Temporary/
            /tmp/y*-*/**/*.log
          retention-days: 14
